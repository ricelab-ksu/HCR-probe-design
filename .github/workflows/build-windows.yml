name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'R version to bundle (default 4.6.1)'
        required: false
        default: '4.6.1'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Bundle portable R runtime (Windows)
        working-directory: desktop
        shell: pwsh
        run: |
          $ver = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "4.6.1" }
          powershell -ExecutionPolicy Bypass -File scripts\bundle_r_win.ps1 -Version $ver

      - name: Build Windows installer (NSIS)
        working-directory: desktop
        run: npm run dist:win

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcr-probe-designer-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: hcr-probe-designer-windows

      - name: Publish Windows installer to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          for f in *.exe; do
            echo "Uploading $f to release $TAG"
            gh release upload "$TAG" "$f" --clobber
          done
